<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Prevent zoom on double-tap / pinch for game UX; viewport-fit for notched phones -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#E85D04" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Ping Pong" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>Ping Pong Score</title>
  <style>
    /* ========== Tunable look (colors also in CONFIG below) ========== */
    :root {
      --orange: #E85D04;
      --orange-dark: #9B3A00;
      --blue: #0077B6;
      --blue-dark: #004E78;
      --ink: #111111;
      --paper: #F7F7F5;
      --muted: #3A3A3A;
      --bar: #1A1A1A;
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-t: env(safe-area-inset-top, 0px);
      --touch-min: 64px;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: var(--ink);
      color: var(--ink);
      font-family: "Avenir Next", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      font-weight: 700;
      -webkit-text-size-adjust: 100%;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    button, input {
      font: inherit;
      touch-action: manipulation;
    }

    button {
      cursor: pointer;
      border: none;
      min-height: var(--touch-min);
      border-radius: 12px;
      font-weight: 800;
      letter-spacing: 0.01em;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 4px solid #111;
      outline-offset: 3px;
    }

    .screen { display: none; position: fixed; inset: 0; }
    .screen.active { display: flex; flex-direction: column; }

    /* ========== SETUP ========== */
    #setup {
      background:
        radial-gradient(120% 80% at 0% 0%, rgba(232, 93, 4, 0.18), transparent 55%),
        radial-gradient(100% 70% at 100% 100%, rgba(0, 119, 182, 0.16), transparent 50%),
        var(--paper);
      padding: calc(16px + var(--safe-t)) 20px calc(20px + var(--safe-b));
      overflow: auto;
      align-items: center;
    }

    .setup-inner {
      width: min(720px, 100%);
      margin: auto;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .brand {
      text-align: center;
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(2rem, 7vw, 3.25rem);
      line-height: 1.05;
      letter-spacing: -0.02em;
      text-wrap: balance;
    }

    .brand p {
      margin: 8px 0 0;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--muted);
      min-height: 24px;
    }

    .player-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    @media (max-width: 560px) {
      .player-row { grid-template-columns: 1fr; }
    }

    .player-card {
      padding: 16px;
      border-radius: 16px;
      color: #fff;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .player-card.p1 { background: var(--orange); }
    .player-card.p2 { background: var(--blue); }

    .player-card label {
      font-size: 1.25rem;
      font-weight: 800;
    }

    .color-tag {
      font-size: 1rem;
      font-weight: 800;
      opacity: 0.95;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .player-card input {
      width: 100%;
      min-height: var(--touch-min);
      padding: 12px 14px;
      border: 4px solid rgba(0,0,0,0.25);
      border-radius: 12px;
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--ink);
      background: #fff;
    }

    .section-label {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 800;
      text-align: center;
    }

    .serve-pick {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .serve-btn {
      min-height: 88px;
      font-size: 1.35rem;
      color: #fff;
      border: 5px solid transparent;
      box-shadow: 0 4px 0 rgba(0,0,0,0.2);
    }

    .serve-btn.p1 { background: var(--orange); }
    .serve-btn.p2 { background: var(--blue); }
    .serve-btn.selected {
      border-color: var(--ink);
      transform: translateY(2px);
      box-shadow: none;
    }

    #startBtn {
      min-height: 80px;
      font-size: 1.75rem;
      background: var(--ink);
      color: #fff;
      width: 100%;
      box-shadow: 0 6px 0 #000;
    }

    #startBtn:active { transform: translateY(3px); box-shadow: 0 3px 0 #000; }

    /* ========== GAME ========== */
    #game {
      background: var(--ink);
    }

    .games-badge {
      position: absolute;
      top: calc(8px + var(--safe-t));
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      background: rgba(0,0,0,0.75);
      color: #fff;
      font-size: 1.1rem;
      font-weight: 800;
      padding: 8px 16px;
      border-radius: 999px;
      border: 2px solid rgba(255,255,255,0.35);
      pointer-events: none;
      white-space: nowrap;
    }

    .court {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 0;
      position: relative;
    }

    .half {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: calc(40px + var(--safe-t)) 12px 12px;
      color: #fff;
      overflow: hidden;
      transition: filter 120ms var(--ease);
    }

    .half.p1 { background: var(--orange); }
    .half.p2 { background: var(--blue); }

    .half.serving {
      box-shadow: inset 0 0 0 10px #fff, inset 0 0 40px rgba(255,255,255,0.35);
    }

    .half.flash::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.55);
      animation: flashPulse 280ms var(--ease) forwards;
      pointer-events: none;
    }

    @keyframes flashPulse {
      from { opacity: 1; }
      to { opacity: 0; }
    }

    .serve-label {
      position: absolute;
      top: calc(48px + var(--safe-t));
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: clamp(1rem, 2.8vw, 1.35rem);
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: rgba(0,0,0,0.35);
      padding: 8px 14px;
      border-radius: 10px;
      opacity: 0;
      transform: scale(0.96);
      transition: opacity 180ms var(--ease), transform 180ms var(--ease);
    }

    .half.serving .serve-label {
      opacity: 1;
      transform: scale(1);
    }

    .paddle-icon {
      width: 28px;
      height: 28px;
      display: block;
    }

    .player-name {
      font-size: clamp(1.25rem, 3.5vw, 2rem);
      font-weight: 900;
      text-shadow: 0 2px 0 rgba(0,0,0,0.25);
      max-width: 95%;
      text-align: center;
      word-break: break-word;
      margin-bottom: 4px;
    }

    .score {
      font-size: 36vh;
      line-height: 0.9;
      font-weight: 900;
      letter-spacing: -0.04em;
      text-shadow: 0 4px 0 rgba(0,0,0,0.28);
      font-variant-numeric: tabular-nums;
    }

    @media (orientation: portrait) {
      .score { font-size: 28vh; }
    }

    .color-name {
      margin-top: 6px;
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      opacity: 0.9;
    }

    .heard {
      position: absolute;
      bottom: calc(88px + var(--safe-b));
      left: 50%;
      transform: translateX(-50%);
      z-index: 6;
      max-width: min(90vw, 520px);
      background: rgba(0,0,0,0.82);
      color: #fff;
      font-size: 1.15rem;
      font-weight: 700;
      padding: 12px 18px;
      border-radius: 12px;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 200ms var(--ease);
    }

    .heard.show { opacity: 1; }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 10px 12px calc(10px + var(--safe-b));
      background: var(--bar);
      border-top: 3px solid #000;
    }

    .toolbar button {
      min-height: var(--touch-min);
      font-size: 1.15rem;
      color: #fff;
      background: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 3px solid #555;
    }

    .toolbar button:disabled {
      opacity: 0.4;
    }

    /* ========== MENU / OVERLAYS ========== */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 20;
      background: rgba(0,0,0,0.72);
      align-items: center;
      justify-content: center;
      padding: 20px;
      padding-bottom: calc(20px + var(--safe-b));
    }

    .overlay.active { display: flex; }

    .panel {
      width: min(480px, 100%);
      background: var(--paper);
      color: var(--ink);
      border-radius: 20px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .panel h2 {
      margin: 0;
      font-size: 1.75rem;
      text-align: center;
    }

    .panel button {
      font-size: 1.25rem;
      background: var(--ink);
      color: #fff;
    }

    .panel .secondary {
      background: #ddd;
      color: var(--ink);
    }

    /* ========== WIN ========== */
    #win {
      z-index: 30;
      flex-direction: column;
      background: rgba(0,0,0,0.88);
      color: #fff;
      text-align: center;
      overflow: hidden;
    }

    #win.active { display: flex; }

    .confetti {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .confetti i {
      position: absolute;
      top: -12px;
      width: 10px;
      height: 18px;
      border-radius: 2px;
      opacity: 0.9;
      animation: fall linear forwards;
    }

    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(720deg);
        opacity: 0.2;
      }
    }

    .win-content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      padding: 24px;
      max-width: 640px;
    }

    .win-eyebrow {
      font-size: 1.35rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin: 0;
    }

    .win-name {
      margin: 0;
      font-size: clamp(3rem, 14vw, 7rem);
      line-height: 0.95;
      font-weight: 900;
      letter-spacing: -0.03em;
      text-wrap: balance;
    }

    .win-score {
      margin: 0;
      font-size: clamp(1.5rem, 5vw, 2.5rem);
      font-weight: 800;
    }

    .win-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: min(520px, 100%);
      margin-top: 8px;
    }

    .win-actions button {
      min-height: 80px;
      font-size: 1.35rem;
      color: #fff;
    }

    #rematchBtn { background: var(--orange); }
    #newPlayersBtn { background: var(--blue); }

    @media (max-width: 480px) {
      .win-actions { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      .half.flash::after { animation: none; opacity: 0.35; }
      .confetti i { animation: none; opacity: 0; }
      .serve-label, .heard { transition: none; }
    }
  </style>
</head>
<body>
  <!-- ========== SETUP SCREEN ========== -->
  <section id="setup" class="screen active" aria-label="Game setup">
    <div class="setup-inner">
      <header class="brand">
        <h1>Ping Pong Score</h1>
        <p>Tap a side to score — the score is announced out loud</p>
      </header>

      <div class="player-row">
        <div class="player-card p1">
          <label for="name1">Player 1</label>
          <span class="color-tag">Orange side</span>
          <input id="name1" type="text" value="Player 1" autocomplete="off" maxlength="24" enterkeyhint="done" />
        </div>
        <div class="player-card p2">
          <label for="name2">Player 2</label>
          <span class="color-tag">Blue side</span>
          <input id="name2" type="text" value="Player 2" autocomplete="off" maxlength="24" enterkeyhint="done" />
        </div>
      </div>

      <p class="section-label" id="serveHeading">Who serves first?</p>
      <div class="serve-pick" role="group" aria-labelledby="serveHeading">
        <button type="button" class="serve-btn p1 selected" id="serve1" aria-pressed="true">Player 1 serves</button>
        <button type="button" class="serve-btn p2" id="serve2" aria-pressed="false">Player 2 serves</button>
      </div>

      <button type="button" id="startBtn">Start Game</button>
    </div>
  </section>

  <!-- ========== GAME SCREEN ========== -->
  <section id="game" class="screen" aria-label="Scoreboard">
    <div class="games-badge" id="gamesBadge" aria-live="polite">Games: 0 – 0</div>
    <div class="court">
      <button type="button" class="half p1 serving" id="half1" aria-label="Score point for player 1">
        <span class="serve-label">
          <svg class="paddle-icon" viewBox="0 0 32 32" aria-hidden="true">
            <ellipse cx="14" cy="12" rx="10" ry="11" fill="#fff"/>
            <rect x="20" y="18" width="5" height="12" rx="2" transform="rotate(35 22 24)" fill="#5c3317"/>
          </svg>
          Serving
        </span>
        <span class="player-name" id="displayName1">Player 1</span>
        <span class="score" id="score1">0</span>
        <span class="color-name">Orange</span>
      </button>
      <button type="button" class="half p2" id="half2" aria-label="Score point for player 2">
        <span class="serve-label">
          <svg class="paddle-icon" viewBox="0 0 32 32" aria-hidden="true">
            <ellipse cx="14" cy="12" rx="10" ry="11" fill="#fff"/>
            <rect x="20" y="18" width="5" height="12" rx="2" transform="rotate(35 22 24)" fill="#5c3317"/>
          </svg>
          Serving
        </span>
        <span class="player-name" id="displayName2">Player 2</span>
        <span class="score" id="score2">0</span>
        <span class="color-name">Blue</span>
      </button>
    </div>
    <div class="heard" id="heardText" aria-live="polite"></div>
    <div class="toolbar">
      <button type="button" id="undoBtn" aria-label="Undo last point">Undo</button>
      <button type="button" id="menuBtn" aria-label="Open menu">Menu</button>
    </div>
  </section>

  <!-- ========== MENU ========== -->
  <div class="overlay" id="menu" role="dialog" aria-modal="true" aria-labelledby="menuTitle">
    <div class="panel">
      <h2 id="menuTitle">Menu</h2>
      <button type="button" id="resumeBtn">Back to game</button>
      <button type="button" class="secondary" id="resetScoresBtn">Reset this game</button>
      <button type="button" class="secondary" id="endToSetupBtn">New players</button>
    </div>
  </div>

  <!-- ========== WIN ========== -->
  <div class="overlay" id="win" role="dialog" aria-modal="true" aria-labelledby="winName">
    <div class="confetti" id="confetti" aria-hidden="true"></div>
    <div class="win-content">
      <p class="win-eyebrow">Game over</p>
      <h2 class="win-name" id="winName">Winner</h2>
      <p class="win-score" id="winScore">11 to 7</p>
      <div class="win-actions">
        <button type="button" id="rematchBtn">Rematch</button>
        <button type="button" id="newPlayersBtn">New Players</button>
      </div>
    </div>
  </div>

  <script>
    /**
     * Ping Pong Score Tracker — senior-friendly PWA
     * Tap to score; the current score is announced out loud.
     * Edit CONFIG to change winning score, colors, debounce, speech rate, etc.
     */
    const CONFIG = {
      winScore: 11,           // Points needed to win (must also lead by winBy)
      winBy: 2,               // Must win by this many points
      serveEvery: 2,          // Serve switches every N points (until deuce)
      deuceAt: 10,            // At this score each (and later), serve every point
      tapDebounceMs: 500,     // Ignore taps closer together than this
      speechRate: 0.9,        // speechSynthesis rate (slower = clearer for seniors)
      speechPitch: 1,
      speechLang: 'en-US',
      vibrateMs: 40,
      ttsCooldownMs: 400,
      colors: {
        0: { key: 'orange', label: 'Orange', css: '#E85D04' },
        1: { key: 'blue', label: 'Blue', css: '#0077B6' }
      },
      defaultNames: ['Player 1', 'Player 2']
    };

    // ---------- State ----------
    const state = {
      names: [...CONFIG.defaultNames],
      scores: [0, 0],
      gamesWon: [0, 0],
      firstServer: 0,       // 0 or 1 for this game
      server: 0,
      history: [],          // stack of { scores, server } for undo
      lastTapAt: 0,
      gameOver: false,
      wakeLock: null,
      heardTimer: null,
      speakQueue: [],
      speakTimer: null,
      ttsBusyUntil: 0
    };

    const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

    // ---------- DOM ----------
    const $ = (id) => document.getElementById(id);
    const els = {
      setup: $('setup'),
      game: $('game'),
      name1: $('name1'),
      name2: $('name2'),
      serve1: $('serve1'),
      serve2: $('serve2'),
      startBtn: $('startBtn'),
      half1: $('half1'),
      half2: $('half2'),
      score1: $('score1'),
      score2: $('score2'),
      displayName1: $('displayName1'),
      displayName2: $('displayName2'),
      gamesBadge: $('gamesBadge'),
      heardText: $('heardText'),
      undoBtn: $('undoBtn'),
      menuBtn: $('menuBtn'),
      menu: $('menu'),
      resumeBtn: $('resumeBtn'),
      resetScoresBtn: $('resetScoresBtn'),
      endToSetupBtn: $('endToSetupBtn'),
      win: $('win'),
      winName: $('winName'),
      winScore: $('winScore'),
      rematchBtn: $('rematchBtn'),
      newPlayersBtn: $('newPlayersBtn'),
      confetti: $('confetti')
    };

    // ---------- Speech synthesis ----------
    function flushSpeakQueue() {
      clearTimeout(state.speakTimer);
      if (!state.speakQueue.length) return;
      if (Date.now() < state.ttsBusyUntil) {
        state.speakTimer = setTimeout(flushSpeakQueue, Math.max(50, state.ttsBusyUntil - Date.now()));
        return;
      }
      const text = state.speakQueue.shift();
      if (!('speechSynthesis' in window)) {
        flushSpeakQueue();
        return;
      }
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.rate = CONFIG.speechRate;
      u.pitch = CONFIG.speechPitch;
      u.lang = CONFIG.speechLang;
      const done = () => {
        state.ttsBusyUntil = Date.now() + CONFIG.ttsCooldownMs;
        state.speakTimer = setTimeout(() => {
          if (state.speakQueue.length) flushSpeakQueue();
        }, CONFIG.ttsCooldownMs);
      };
      u.onend = done;
      u.onerror = done;
      window.speechSynthesis.speak(u);
    }

    function speak(text) {
      if (!text) return;
      showHeard(text);
      state.speakQueue.push(text);
      clearTimeout(state.speakTimer);
      state.speakTimer = setTimeout(flushSpeakQueue, IS_IOS ? 180 : 0);
    }

    function cancelSpeech() {
      clearTimeout(state.speakTimer);
      state.speakQueue = [];
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      state.ttsBusyUntil = 0;
    }

    function haptic() {
      if (navigator.vibrate) navigator.vibrate(CONFIG.vibrateMs);
    }

    // ---------- Serve / rules ----------
    function computeServer(firstServer, scores) {
      const total = scores[0] + scores[1];
      const deuce = scores[0] >= CONFIG.deuceAt && scores[1] >= CONFIG.deuceAt;
      if (deuce) {
        return (firstServer + total) % 2;
      }
      const block = Math.floor(total / CONFIG.serveEvery);
      return (firstServer + block) % 2;
    }

    function hasWinner() {
      const [a, b] = state.scores;
      const need = CONFIG.winScore;
      if (a >= need && a - b >= CONFIG.winBy) return 0;
      if (b >= need && b - a >= CONFIG.winBy) return 1;
      return null;
    }

    // ---------- UI updates ----------
    function updateServeUI() {
      const s = state.server;
      els.half1.classList.toggle('serving', s === 0);
      els.half2.classList.toggle('serving', s === 1);
    }

    function updateScoresUI() {
      els.score1.textContent = String(state.scores[0]);
      els.score2.textContent = String(state.scores[1]);
      els.undoBtn.disabled = state.history.length === 0 || state.gameOver;
      updateServeUI();
      els.gamesBadge.textContent = `Games: ${state.gamesWon[0]} – ${state.gamesWon[1]}`;
    }

    function flashHalf(player) {
      const el = player === 0 ? els.half1 : els.half2;
      el.classList.remove('flash');
      void el.offsetWidth;
      el.classList.add('flash');
      setTimeout(() => el.classList.remove('flash'), 300);
    }

    function showHeard(text, durationMs) {
      els.heardText.textContent = text;
      els.heardText.classList.add('show');
      clearTimeout(state.heardTimer);
      state.heardTimer = setTimeout(() => els.heardText.classList.remove('show'), durationMs || 4500);
    }

    function showScreen(name) {
      els.setup.classList.toggle('active', name === 'setup');
      els.game.classList.toggle('active', name === 'game');
    }

    function updateServeButtons() {
      const n1 = (els.name1.value || CONFIG.defaultNames[0]).trim();
      const n2 = (els.name2.value || CONFIG.defaultNames[1]).trim();
      els.serve1.textContent = `${n1} serves`;
      els.serve2.textContent = `${n2} serves`;
    }

    // ---------- Announcements ----------
    function scorePhrase() {
      return `${state.scores[0]}, ${state.scores[1]}`;
    }

    function announceScore() {
      speak(scorePhrase());
    }

    // ---------- Scoring ----------
    function pushHistory() {
      state.history.push({
        scores: [...state.scores],
        server: state.server
      });
    }

    function addPoint(player, { silent } = {}) {
      if (state.gameOver) return;
      if (player !== 0 && player !== 1) return;

      pushHistory();
      state.scores[player] += 1;
      state.server = computeServer(state.firstServer, state.scores);
      updateScoresUI();
      flashHalf(player);
      haptic();

      const winner = hasWinner();
      if (winner !== null) {
        state.gameOver = true;
        state.gamesWon[winner] += 1;
        updateScoresUI();
        if (!silent) {
          speak(`${state.scores[0]} to ${state.scores[1]}`);
        }
        showWin(winner);
        releaseWakeLock();
        return;
      }

      if (!silent) announceScore();
    }

    function undo() {
      if (state.gameOver || state.history.length === 0) return;
      const prev = state.history.pop();
      state.scores = [...prev.scores];
      state.server = prev.server;
      updateScoresUI();
      haptic();
      announceScore();
    }

    // ---------- Win overlay ----------
    function spawnConfetti() {
      els.confetti.innerHTML = '';
      const colors = [CONFIG.colors[0].css, CONFIG.colors[1].css, '#fff', '#FFD166', '#06D6A0'];
      const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduce) return;
      for (let i = 0; i < 48; i++) {
        const bit = document.createElement('i');
        bit.style.left = `${Math.random() * 100}%`;
        bit.style.background = colors[i % colors.length];
        bit.style.animationDuration = `${2.2 + Math.random() * 2.5}s`;
        bit.style.animationDelay = `${Math.random() * 0.8}s`;
        bit.style.transform = `rotate(${Math.random() * 360}deg)`;
        els.confetti.appendChild(bit);
      }
    }

    function showWin(winner) {
      els.winName.textContent = state.names[winner];
      els.winName.style.color = CONFIG.colors[winner].css;
      els.winScore.textContent = `${state.scores[0]} to ${state.scores[1]}`;
      spawnConfetti();
      els.win.classList.add('active');
    }

    function hideWin() {
      els.win.classList.remove('active');
      els.confetti.innerHTML = '';
    }

    // ---------- Wake Lock ----------
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          state.wakeLock = await navigator.wakeLock.request('screen');
          state.wakeLock.addEventListener('release', () => {
            state.wakeLock = null;
          });
        }
      } catch (_) {
        /* unsupported or denied — ignore */
      }
    }

    function releaseWakeLock() {
      if (state.wakeLock) {
        state.wakeLock.release().catch(() => {});
        state.wakeLock = null;
      }
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && els.game.classList.contains('active') && !state.gameOver) {
        requestWakeLock();
      }
    });

    // ---------- Game flow ----------
    function readSetupNames() {
      const n1 = (els.name1.value || '').trim() || CONFIG.defaultNames[0];
      const n2 = (els.name2.value || '').trim() || CONFIG.defaultNames[1];
      return [n1, n2];
    }

    function startGame({ rematch, swapServer } = {}) {
      state.names = readSetupNames();
      els.displayName1.textContent = state.names[0];
      els.displayName2.textContent = state.names[1];
      els.half1.setAttribute('aria-label', `Score point for ${state.names[0]}`);
      els.half2.setAttribute('aria-label', `Score point for ${state.names[1]}`);

      if (rematch) {
        if (swapServer) state.firstServer = 1 - state.firstServer;
      } else {
        state.firstServer = els.serve1.classList.contains('selected') ? 0 : 1;
      }

      state.scores = [0, 0];
      state.server = state.firstServer;
      state.history = [];
      state.gameOver = false;

      hideWin();
      els.menu.classList.remove('active');
      updateScoresUI();
      showScreen('game');
      requestWakeLock();
    }

    function goToSetup({ resetGames } = {}) {
      cancelSpeech();
      releaseWakeLock();
      hideWin();
      els.menu.classList.remove('active');
      if (resetGames) state.gamesWon = [0, 0];
      showScreen('setup');
      updateServeButtons();
    }

    function resetThisGame() {
      state.scores = [0, 0];
      state.server = state.firstServer;
      state.history = [];
      state.gameOver = false;
      hideWin();
      updateScoresUI();
      els.menu.classList.remove('active');
      requestWakeLock();
      announceScore();
    }

    // ---------- Tap scoring with debounce ----------
    function onHalfTap(player, event) {
      event.preventDefault();
      const now = Date.now();
      if (now - state.lastTapAt < CONFIG.tapDebounceMs) return;
      state.lastTapAt = now;
      addPoint(player);
    }

    // ---------- Wire events ----------
    function wire() {
      els.name1.addEventListener('input', updateServeButtons);
      els.name2.addEventListener('input', updateServeButtons);

      els.serve1.addEventListener('click', () => {
        els.serve1.classList.add('selected');
        els.serve2.classList.remove('selected');
        els.serve1.setAttribute('aria-pressed', 'true');
        els.serve2.setAttribute('aria-pressed', 'false');
      });
      els.serve2.addEventListener('click', () => {
        els.serve2.classList.add('selected');
        els.serve1.classList.remove('selected');
        els.serve2.setAttribute('aria-pressed', 'true');
        els.serve1.setAttribute('aria-pressed', 'false');
      });

      els.startBtn.addEventListener('click', () => startGame());

      els.half1.addEventListener('click', (e) => onHalfTap(0, e));
      els.half2.addEventListener('click', (e) => onHalfTap(1, e));

      els.undoBtn.addEventListener('click', () => undo());

      els.menuBtn.addEventListener('click', () => {
        els.menu.classList.add('active');
      });
      els.resumeBtn.addEventListener('click', () => {
        els.menu.classList.remove('active');
      });

      els.resetScoresBtn.addEventListener('click', () => resetThisGame());
      els.endToSetupBtn.addEventListener('click', () => goToSetup({ resetGames: true }));

      els.rematchBtn.addEventListener('click', () => {
        startGame({ rematch: true, swapServer: true });
      });
      els.newPlayersBtn.addEventListener('click', () => goToSetup({ resetGames: true }));
    }

    // ---------- Service worker ----------
    // iOS Safari often keeps the blue loading bar spinning forever when a service
    // worker claims the page / intercepts navigations. Skip SW on iOS.
    if ('serviceWorker' in navigator) {
      if (IS_IOS) {
        navigator.serviceWorker.getRegistrations().then((regs) => {
          regs.forEach((reg) => reg.unregister());
        }).catch(() => {});
        if (window.caches) {
          caches.keys().then((keys) => Promise.all(keys.map((k) => caches.delete(k)))).catch(() => {});
        }
      } else {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(() => {});
        });
      }
    }

    wire();
    updateServeButtons();
  </script>
</body>
</html>
